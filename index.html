<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roadmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!--
      THESIS: a climb, not a checklist. A mountain ridge at the top shows the whole route with you on it; the single task to do now sits right under it with everything needed to do it.
      OWN-WORLD: night sky over a ridge: deep navy ground with an aurora glow (teal and violet), off-white ink, teal for ground covered, one amber marker for "you are here", violet-blue gradient for the one action; frosted rail and task card, soft glow shadows.
      STORY: open it beside your editor, see how far up you are, read the steps, press D, watch the marker climb.
      FIRST VIEWPORT: ridge hero with the milestone title, count and your marker; segmented task progress; the current task card at display size with steps and a sticky Mark done; frosted route rail on the left.
      FORM: trekking route card fused with terminal wayfinding (next decision first); 6th of the grounded list, seed 7b5118f5.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <a class="skip" href="#app">Skip to the current task</a>
    <header class="bar">
      <div class="bar-in">
        <span class="brand">
          <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20 9.5 7l4 6.5L16 10l6 10z"/></svg>
          Roadmap
        </span>
        <div class="overall" id="overall" role="img" aria-label="Progress">
          <span class="overall-track"><span class="overall-fill" id="overallBar"></span></span>
          <span class="overall-text"><span id="overallText">0 of 0</span> tasks</span>
        </div>
        <a class="bar-link" href="interview-prep.html"><span class="long">Interview prep</span><span class="short">Prep</span></a>
        <div class="timer">
          <button class="timer-btn" id="timerToggle" data-action="timer-toggle" data-running="false" aria-label="Start 50-minute focus timer">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5 3.2v9.6l7.6-4.8z"/></svg>
            <span id="timerText">50:00</span>
          </button>
          <button class="timer-reset" id="timerReset" data-action="timer-reset" aria-label="Reset timer" hidden>Reset</button>
        </div>
      </div>
    </header>
    <div class="shell">
      <nav class="rail" id="rail" aria-label="Route"></nav>
      <main class="main" id="app"></main>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden />
    <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button class="toast-act" id="toastAction" hidden></button></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
